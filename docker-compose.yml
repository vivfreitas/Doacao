# Conexao com o BD e um container para a nossa API
services:
  mysql-db:
    image: mysql:oraclelinux9
    container_name: mysql-amor-de-pata
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: patas
    ports:
      - "8085:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  projeto-patas:
    build: .
    image: vivianfreitasdev/amor-de-pata:v2
    container_name: amor-de-pata
    ports:
      - "8080:8080"
      - "5005:5005" # Porta do Debug
    volumes:
      - ./logs:/app/logs
    depends_on:
        mysql-db:
          condition: service_healthy
    environment:
      # Agente de Debug
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/patas
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
