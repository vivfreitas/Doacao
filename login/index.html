<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles-scripts/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <title>Amor de Pata</title>
</head>
<body>
    <header>
        <div id="titulo-login-cadastro">
            <img id="img-titulo" src="/imgs/LogoTeste.png" alt="">
            <h1 id="titulo"> FAÇA O SEU LOGIN </h1>
            <p id="description-titulo"> Doe e/ou adote um amiguinho</p>
        </div>
    </header>
    
    <main>
        <div class="painel-laranja laranja-login">
            <div class="form-login">
                <article aria-label="form-cadastro" id="form-article">
                <p id="erro-senha-email"> Senhas não conferem. <br>Verifique-as e tente novamente.</p>
                <form action="" id="form" autocomplete="true">

                     <label for="id-email" class="label-form">
                        E-MAIL
                        <span><i id="teste" class="bi bi-envelope-at"></i></span><input type="email" name="" id="id-email" class="input-style">
                    </label>

                    <label for="id-senha" class="label-form">
                        SENHA
                        <span><i class="bi bi-key" id="icon-senha1"></i></i></span><input type="password" name="" id="id-senha-principal" class="input-style">
                    </label>
                    
                    <div id="button-send">
                        <button class="bnt-form-cadastro bnt-form-login" id="bnt-login"> ENTRAR </button>
                    </div>
                </form>
                </article>
                <div id="final-form">
                    <p>OU</p>
                    <div>
                        <a href=""><img class="auth-redes-img" src="/imgs/facebook.png" alt="" srcset=""></a>
                        <a href=""><img class="auth-redes-img"  src="/imgs/gmail.png" alt="" srcset=""></a>
                    </div>
                    <p> Ainda não tem um cadastro? <span><a href="/cadastro/index.html" id="logar-cadastro"> Cadastre-se aqui!</a></span></p>
                </div>
            </div>
            <footer>
                <div id="redesSociais">
                <p>Rede: </p>
                <a href="http://www.linkedin.com/in/vivianfreitas" target="_blank" rel="noopener noreferrer"><i class="bi bi-linkedin" aria-label="Acessa meu linkedin"></i></a>
                <a href="https://github.com/vivfreitas" target="_blank" rel="noopener noreferrer"><i class="bi bi-github" aria-label="Acessa meu github"></i></a>
                </div>
                <div id="final-footer-p"> <p >@ 2025 Vivian Freitas. Totos os direitos reservados.Logo criado com Canva. Imagens por Free!pik</p></div>
            </footer>
        </div>
    </main>
    <script src="/styles-scripts/script.js"></script>
</body>
</html>
